<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="950" viewBox="0 0 1000 950">
  <defs>
    <!-- Darker Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#04060a"/>
      <stop offset="50%" style="stop-color:#080c14"/>
      <stop offset="100%" style="stop-color:#0f1624"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4a9eff"/>
      <stop offset="50%" style="stop-color:#6c5ce7"/>
      <stop offset="100%" style="stop-color:#fd79a8"/>
    </linearGradient>
    
    <!-- Gradient used for both headings -->
    <linearGradient id="solidBlueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2196F3"/>
      <stop offset="50%" style="stop-color:#1976D2"/>
      <stop offset="100%" style="stop-color:#1565C0"/>
    </linearGradient>

    <linearGradient id="grid1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6c5ce7;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#6c5ce7;stop-opacity:0.03"/>
    </linearGradient>
    <linearGradient id="grid2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a9eff;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#4a9eff;stop-opacity:0.03"/>
    </linearGradient>
    <linearGradient id="grid3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fd79a8;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#fd79a8;stop-opacity:0.03"/>
    </linearGradient>
    <linearGradient id="grid4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fdcb6e;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#fdcb6e;stop-opacity:0.03"/>
    </linearGradient>
    <linearGradient id="grid5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00b894;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#00b894;stop-opacity:0.03"/>
    </linearGradient>
    <linearGradient id="grid6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e17055;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#e17055;stop-opacity:0.03"/>
    </linearGradient>
  </defs>

  <!-- Card Background -->
  <rect x="0" y="0" width="1000" height="950" rx="24" ry="24" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="1000" height="950" rx="24" ry="24" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" opacity="0.2"/>
  <rect x="2" y="2" width="996" height="946" rx="22" ry="22" fill="none" stroke="#4a9eff" stroke-width="0.5" opacity="0.05"/>

  <!-- ============ CONTENT SECTION ============ -->
  <g transform="translate(60, 40)">
    
    <!-- Heading: The Story So Far (No Glow, Matching Blue Gradient) -->
    <g transform="translate(0, 20)" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.1s" fill="freeze"/>
      
      <!-- Brackets -->
      <text x="0" y="28" font-family="'Courier New', monospace" font-size="32" fill="url(#solidBlueGrad)" opacity="0.5">[</text>
      
      <!-- Main Heading -->
      <text x="22" y="28" font-family="'Segoe UI', Arial, sans-serif" font-size="28" font-weight="bold" fill="url(#solidBlueGrad)">The Story So Far</text>
      
      <!-- Closing Bracket -->
      <text x="258" y="28" font-family="'Courier New', monospace" font-size="32" fill="url(#solidBlueGrad)" opacity="0.5">]</text>
      
      <!-- Underline -->
      <rect x="22" y="38" width="230" height="2" rx="1" fill="url(#solidBlueGrad)" opacity="0.15"/>
      <circle cx="22" cy="39" r="2" fill="#2196F3" opacity="0.3"/>
      <circle cx="252" cy="39" r="2" fill="#1565C0" opacity="0.3"/>
    </g>

    <!-- Bio paragraphs -->
    <g font-family="'Segoe UI', Arial, sans-serif" font-size="13.5" fill="#b0c4de">
      <text x="0" y="105">
        <tspan x="0" dy="0" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.3s" fill="freeze"/>I'm Atharva Thakur, a developer passionate about building modern, practical, and user-focused digital experiences that solve real-world problems.</tspan>
        <tspan x="0" dy="22" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.5s" fill="freeze"/>My journey in technology is driven by a deep curiosity for how things work and a desire to create tools that make a difference. I believe</tspan>
        <tspan x="0" dy="22" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.7s" fill="freeze"/>that the best products are born at the intersection of robust engineering and empathetic design, which is why I focus on both.</tspan>
      </text>
      
      <text x="0" y="195">
        <tspan x="0" dy="0" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.9s" fill="freeze"/>I work across web development, application development, UI/UX design, and cloud technologies, with a focus on turning ideas into</tspan>
        <tspan x="0" dy="22" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.6s" begin="1.1s" fill="freeze"/>polished and functional products. I believe that great software is not just about code, but about the experience it delivers to the end user.</tspan>
        <tspan x="0" dy="22" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.6s" begin="1.3s" fill="freeze"/>Every line of code I write is an opportunity to improve someone's day, and I take that responsibility seriously.</tspan>
      </text>

      <text x="0" y="285">
        <tspan x="0" dy="0" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.6s" begin="1.5s" fill="freeze"/>I work with technologies including JavaScript, Python, React, Firebase, and modern web development tools, with an emphasis on clean</tspan>
        <tspan x="0" dy="22" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.6s" begin="1.7s" fill="freeze"/>architecture, responsive interfaces, maintainable code, and thoughtful user experiences. I am constantly learning and adapting to new</tspan>
        <tspan x="0" dy="22" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.6s" begin="1.9s" fill="freeze"/>technologies to ensure my solutions are always at the forefront of industry standards. I enjoy the challenge of solving complex problems</tspan>
        <tspan x="0" dy="22" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.6s" begin="2.1s" fill="freeze"/>and the satisfaction of seeing a project come to life from a simple idea to a fully deployed application.</tspan>
      </text>
    </g>

    <rect x="0" y="385" width="850" height="3" rx="1.5" fill="url(#solidBlueGrad)" opacity="0.1"/>

    <!-- 3x2 GRID (6 Boxes) -->
    <g transform="translate(0, 410)">
      
      <!-- Box 1 -->
      <g opacity="0">
        <animate attributeName="opacity" values="0;1" dur="0.5s" begin="2.5s" fill="freeze"/>
        <rect x="0" y="0" width="270" height="100" rx="10" ry="10" fill="url(#grid1)" stroke="#6c5ce7" stroke-width="0.8" opacity="0.7"/>
        <text x="14" y="24" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="bold" fill="#6c5ce7">✦ My approach:</text>
        <text x="14" y="52" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#b0c4de">
          <tspan x="14" dy="0">I believe in building with purpose,</tspan>
          <tspan x="14" dy="18">learning by doing, and continuously</tspan>
          <tspan x="14" dy="18">improving through every project.</tspan>
        </text>
      </g>

      <!-- Box 2 -->
      <g opacity="0">
        <animate attributeName="opacity" values="0;1" dur="0.5s" begin="2.8s" fill="freeze"/>
        <rect x="290" y="0" width="270" height="100" rx="10" ry="10" fill="url(#grid2)" stroke="#4a9eff" stroke-width="0.8" opacity="0.7"/>
        <text x="304" y="24" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="bold" fill="#4a9eff">⟳ Currently:</text>
        <text x="304" y="52" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#b0c4de">
          <tspan x="304" dy="0">I'm exploring modern web technologies,</tspan>
          <tspan x="304" dy="18">scalable applications, automation, and</tspan>
          <tspan x="304" dy="18">innovative solutions to real-world problems.</tspan>
        </text>
      </g>

      <!-- Box 3 -->
      <g opacity="0">
        <animate attributeName="opacity" values="0;1" dur="0.5s" begin="3.1s" fill="freeze"/>
        <rect x="580" y="0" width="270" height="100" rx="10" ry="10" fill="url(#grid3)" stroke="#fd79a8" stroke-width="0.8" opacity="0.7"/>
        <text x="594" y="24" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="bold" fill="#fd79a8">✦ Beyond coding:</text>
        <text x="594" y="52" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#b0c4de">
          <tspan x="594" dy="0">I enjoy experimenting with new ideas,</tspan>
          <tspan x="594" dy="18">exploring emerging technologies, and</tspan>
          <tspan x="594" dy="18">transforming concepts into projects.</tspan>
        </text>
      </g>

      <!-- Box 4 -->
      <g opacity="0">
        <animate attributeName="opacity" values="0;1" dur="0.5s" begin="3.4s" fill="freeze"/>
        <rect x="0" y="120" width="270" height="100" rx="10" ry="10" fill="url(#grid4)" stroke="#fdcb6e" stroke-width="0.8" opacity="0.7"/>
        <text x="14" y="144" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="bold" fill="#fdcb6e">★ Long-term goal:</text>
        <text x="14" y="172" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#b0c4de">
          <tspan x="14" dy="0">To become a versatile developer</tspan>
          <tspan x="14" dy="18">capable of designing, building, and</tspan>
          <tspan x="14" dy="18">scaling products with strong engineering.</tspan>
        </text>
      </g>

      <!-- Box 5 -->
      <g opacity="0">
        <animate attributeName="opacity" values="0;1" dur="0.5s" begin="3.7s" fill="freeze"/>
        <rect x="290" y="120" width="270" height="100" rx="10" ry="10" fill="url(#grid5)" stroke="#00b894" stroke-width="0.8" opacity="0.7"/>
        <text x="304" y="144" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="bold" fill="#00b894">⚡ Core values:</text>
        <text x="304" y="172" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#b0c4de">
          <tspan x="304" dy="0">Simplicity, performance, and</tspan>
          <tspan x="304" dy="18">accessibility. I strive to write code</tspan>
          <tspan x="304" dy="18">that is clean, efficient, and impactful.</tspan>
        </text>
      </g>

      <!-- Box 6 -->
      <g opacity="0">
        <animate attributeName="opacity" values="0;1" dur="0.5s" begin="4.0s" fill="freeze"/>
        <rect x="580" y="120" width="270" height="100" rx="10" ry="10" fill="url(#grid6)" stroke="#e17055" stroke-width="0.8" opacity="0.7"/>
        <text x="594" y="144" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="bold" fill="#e17055">◈ Philosophy:</text>
        <text x="594" y="172" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#b0c4de">
          <tspan x="594" dy="0">Technology should empower people.</tspan>
          <tspan x="594" dy="18">I focus on human-centric design</tspan>
          <tspan x="594" dy="18">to create meaningful interactions.</tspan>
        </text>
      </g>
    </g>

    <!-- Future Section -->
    <rect x="0" y="680" width="850" height="1.5" fill="url(#solidBlueGrad)" opacity="0.08" rx="0.75"/>
    
    <g transform="translate(0, 700)" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.5s" begin="4.3s" fill="freeze"/>
      <rect x="0" y="12" width="40" height="2" rx="1" fill="url(#solidBlueGrad)" opacity="0.6"/>
      <text x="50" y="18" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="bold" fill="url(#solidBlueGrad)">The Future I Envision</text>
      <rect x="225" y="12" width="625" height="2" rx="1" fill="url(#solidBlueGrad)" opacity="0.3"/>
      <circle cx="222" cy="12" r="2.5" fill="#2196F3" opacity="0.5"/>
    </g>

    <!-- Envision Paragraph -->
    <g font-family="'Segoe UI', Arial, sans-serif" font-size="13.5" fill="#b0c4de">
      <text x="0" y="760">
        <tspan x="0" dy="0" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.6s" begin="4.7s" fill="freeze"/>I aim to grow as a well-rounded technology professional by continuously strengthening my technical expertise, problem-solving abilities, and</tspan>
        <tspan x="0" dy="22" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.6s" begin="4.9s" fill="freeze"/>understanding of product development. I value consistency, attention to detail, and a practical approach to challenges, with the long-term</tspan>
        <tspan x="0" dy="22" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.6s" begin="5.1s" fill="freeze"/>goal of contributing to innovative projects and building technology that delivers measurable value. I envision myself leading projects</tspan>
        <tspan x="0" dy="22" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.6s" begin="5.3s" fill="freeze"/>that bridge the gap between complex engineering and seamless user experiences, creating tools that make a tangible difference in</tspan>
        <tspan x="0" dy="22" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.6s" begin="5.5s" fill="freeze"/>people's lives. My ultimate aspiration is to build a legacy of impactful software that stands the test of time and drives positive change.</tspan>
      </text>
    </g>
  </g>
</svg>
