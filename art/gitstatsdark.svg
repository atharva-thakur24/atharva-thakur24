<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <defs>
    <!-- Background Gradient - Dark -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e1a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0d1b2a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1b2a4a;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4a9eff" />
      <stop offset="50%" style="stop-color:#6c5ce7" />
      <stop offset="100%" style="stop-color:#fd79a8" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff" />
      <stop offset="100%" style="stop-color:#0090ff" />
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="intenseGlow">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <line x1="80" y1="0" x2="80" y2="80" stroke="#4a9eff" stroke-width="0.3" stroke-opacity="0.03" />
      <line x1="0" y1="80" x2="80" y2="80" stroke="#4a9eff" stroke-width="0.3" stroke-opacity="0.03" />
    </pattern>

    <pattern id="circuit" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M0 60 L30 60 L40 70 L40 90 L60 90 L70 80 L70 60 L90 60" fill="none" stroke="#00d4ff" stroke-width="0.5" stroke-opacity="0.04" />
      <path d="M80 0 L80 30 L70 40 L50 40 L40 30 L40 10 L20 10 L10 20 L10 40" fill="none" stroke="#7c3aed" stroke-width="0.5" stroke-opacity="0.04" />
      <circle cx="40" cy="60" r="2" fill="#00d4ff" fill-opacity="0.04" />
      <circle cx="80" cy="40" r="2" fill="#7c3aed" fill-opacity="0.04" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="700" fill="url(#bgGrad)" rx="20" />
  <rect width="1200" height="700" fill="url(#grid)" rx="20" />
  <rect width="1200" height="700" fill="url(#circuit)" rx="20" />
  <rect x="3" y="3" width="1194" height="694" rx="18" fill="none" stroke="url(#primaryGrad)" stroke-width="1" stroke-opacity="0.15" />
  <rect x="8" y="8" width="1184" height="684" rx="14" fill="none" stroke="#4a9eff" stroke-width="0.5" stroke-opacity="0.06" />

  <!-- Glow Orbs -->
  <circle cx="600" cy="350" r="220" fill="url(#primaryGrad)" fill-opacity="0.04" filter="url(#intenseGlow)" />
  <circle cx="600" cy="350" r="150" fill="url(#cyanGrad)" fill-opacity="0.05" filter="url(#glow)" />

  <!-- Decorative Corner Accents -->
  <g opacity="0.6">
    <rect x="20" y="20" width="30" height="3" rx="1.5" fill="#00d4ff" fill-opacity="0.2" />
    <rect x="20" y="20" width="3" height="30" rx="1.5" fill="#00d4ff" fill-opacity="0.2" />
    <rect x="1150" y="20" width="30" height="3" rx="1.5" fill="#ec4899" fill-opacity="0.2" />
    <rect x="1177" y="20" width="3" height="30" rx="1.5" fill="#ec4899" fill-opacity="0.2" />
    <rect x="20" y="650" width="30" height="3" rx="1.5" fill="#ec4899" fill-opacity="0.2" />
    <rect x="20" y="647" width="3" height="30" rx="1.5" fill="#ec4899" fill-opacity="0.2" />
    <rect x="1150" y="650" width="30" height="3" rx="1.5" fill="#00d4ff" fill-opacity="0.2" />
    <rect x="1177" y="647" width="3" height="30" rx="1.5" fill="#00d4ff" fill-opacity="0.2" />
  </g>

  <!-- Title -->
  <g transform="translate(600, 45)">
    <text x="0" y="0" font-family="'Segoe UI', 'SF Pro Display', sans-serif" font-size="26" font-weight="700" fill="#00d4ff" text-anchor="middle" letter-spacing="3">
      📊 GITHUB STATS
    </text>
    <rect x="-150" y="12" width="300" height="3" rx="1.5" fill="url(#primaryGrad)" fill-opacity="0.25" />
  </g>

  <!-- Stats Card - Left (55% width) - Much larger -->
  <g transform="translate(25, 75)">
    <rect width="630" height="545" rx="13.5" fill="#0d1b2a" stroke="#4a9eff" stroke-width="0.5" stroke-opacity="0.15" />
    <image x="0" y="0" width="630" height="545" src="https://ghstats.dev/api/card?username=atharva-thakur24&amp;theme=midnight&amp;border_radius=13.5" preserveAspectRatio="xMidYMid slice" />
  </g>

  <!-- Stats Card - Right Top (Sparkline) - Much larger -->
  <g transform="translate(670, 75)">
    <rect width="505" height="266" rx="13.5" fill="#0d1b2a" stroke="#4a9eff" stroke-width="0.5" stroke-opacity="0.15" />
    <image x="0" y="0" width="505" height="266" src="https://ghstats.dev/api/sparkline?username=atharva-thakur24&amp;theme=midnight&amp;days=30&amp;width=505&amp;height=266&amp;title=Contribution+Graph" preserveAspectRatio="xMidYMid slice" />
  </g>

  <!-- Stats Card - Right Bottom (Languages) - Much larger -->
  <g transform="translate(670, 354)">
    <rect width="505" height="266" rx="13.5" fill="#0d1b2a" stroke="#4a9eff" stroke-width="0.5" stroke-opacity="0.15" />
    <image x="0" y="0" width="505" height="266" src="https://ghstats.dev/api/langs?username=atharva-thakur24&amp;theme=midnight&amp;max_langs=5&amp;layout=donut" preserveAspectRatio="xMidYMid slice" />
  </g>

  <!-- Bottom Status Bar -->
  <g transform="translate(0, 650)" opacity="0.8">
    <rect x="40" y="0" width="1120" height="32" rx="16" fill="#0a0e1a" fill-opacity="0.3" stroke="#4a9eff" stroke-width="0.5" stroke-opacity="0.08" />
    
    <g font-family="'SF Mono', 'Courier New', monospace" font-size="10" fill="#4a6a7a">
      <text x="60" y="21" fill="#00d4ff" fill-opacity="0.5">●</text>
      <text x="72" y="21" fill="#94a3b8" fill-opacity="0.4">STATUS: SYNCED</text>
      
      <text x="250" y="21" fill-opacity="0.2">|</text>
      <text x="265" y="21" fill-opacity="0.3">UPDATED: LIVE</text>
      
      <text x="430" y="21" fill-opacity="0.2">|</text>
      <text x="445" y="21" fill="#7c3aed" fill-opacity="0.4">COMMITS: 42</text>

      <text x="850" y="21" text-anchor="end" fill-opacity="0.3">CONTRIBUTIONS: 128</text>
      
      <text x="980" y="21" fill-opacity="0.2">|</text>
      <text x="995" y="21" fill="#27c93f" fill-opacity="0.4">●</text>
      <text x="1005" y="21" fill-opacity="0.3">ACTIVE</text>
      
      <text x="1115" y="21" text-anchor="end" fill="#4a6a7a" fill-opacity="0.2">v2.0</text>
    </g>
  </g>
</svg>
