<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380">
  <defs>
    <!-- Main Background Gradient -->
    <linearGradient id="bgMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#070712;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#0a0a1e;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#0d0d28;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#060610;stop-opacity:1" />
    </linearGradient>

    <!-- Primary Accent Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0090ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:1" />
    </linearGradient>

    <!-- Secondary Accent -->
    <linearGradient id="secondaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#4f46e5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>

    <!-- Tertiary Accent -->
    <linearGradient id="tertiaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ec4899;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e2e8f0;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#94a3b8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>

    <!-- Highlight Text Gradient -->
    <linearGradient id="highlightGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="33%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="66%" style="stop-color:#ec4899;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:1" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="strongGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="1.2" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="innerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in2="SourceAlpha" operator="arithmetic" k2="-1" k3="1" result="shadowDiff" />
      <feFlood flood-color="#00d4ff" flood-opacity="0.3" />
      <feComposite in2="shadowDiff" operator="in" />
      <feComposite in2="SourceGraphic" operator="over" />
    </filter>

    <!-- 3D Depth Shadow -->
    <filter id="depthShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00d4ff" flood-opacity="0.15" />
    </filter>

    <!-- Particle Gradient -->
    <radialGradient id="particleGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#7c3aed;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#0090ff;stop-opacity:0" />
    </radialGradient>

    <!-- Pulse Line Gradient -->
    <linearGradient id="pulseLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0" />
      <stop offset="20%" style="stop-color:#7c3aed;stop-opacity:0.6" />
      <stop offset="50%" style="stop-color:#00d4ff;stop-opacity:0.8" />
      <stop offset="80%" style="stop-color:#ec4899;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:0" />
    </linearGradient>

    <!-- Hex Grid Pattern -->
    <pattern id="hexGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M20 0 L40 10 L40 30 L20 40 L0 30 L0 10 Z" fill="none" stroke="#00d4ff" stroke-width="0.3" opacity="0.08" />
    </pattern>

    <!-- Grid Pattern -->
    <pattern id="gridPattern" width="60" height="60" patternUnits="userSpaceOnUse">
      <line x1="60" y1="0" x2="60" y2="60" stroke="#4f46e5" stroke-width="0.2" opacity="0.06" />
      <line x1="0" y1="60" x2="60" y2="60" stroke="#4f46e5" stroke-width="0.2" opacity="0.06" />
    </pattern>

    <!-- Code Pattern -->
    <pattern id="codePattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <text x="0" y="15" font-family="'Courier New', monospace" font-size="6" fill="#00d4ff" opacity="0.04">{ }</text>
    </pattern>

    <!-- Language Colors -->
    <linearGradient id="firebaseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFCA28" />
      <stop offset="100%" style="stop-color:#FFA000" />
    </linearGradient>
    <linearGradient id="pythonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3776AB" />
      <stop offset="100%" style="stop-color:#FFD43B" />
    </linearGradient>
    <linearGradient id="cGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00599C" />
      <stop offset="100%" style="stop-color:#A8B9CC" />
    </linearGradient>
    <linearGradient id="javaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#007396" />
      <stop offset="100%" style="stop-color:#5382A1" />
    </linearGradient>
    <linearGradient id="htmlGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E34F26" />
      <stop offset="100%" style="stop-color:#F06529" />
    </linearGradient>
    <linearGradient id="cssGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1572B6" />
      <stop offset="100%" style="stop-color:#33A9DC" />
    </linearGradient>
    <linearGradient id="jsGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F7DF1E" />
      <stop offset="100%" style="stop-color:#F0DB4F" />
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="380" fill="url(#bgMain)" rx="16" />
  <rect width="1200" height="380" fill="url(#hexGrid)" rx="16" />
  <rect width="1200" height="380" fill="url(#gridPattern)" rx="16" />
  <rect width="1200" height="380" fill="url(#codePattern)" rx="16" />

  <!-- Border Glow -->
  <rect x="12" y="12" width="1176" height="356" rx="20" fill="none" stroke="url(#primaryGrad)" stroke-width="1.5" opacity="0.2">
    <animate attributeName="opacity" values="0.1;0.3;0.1" dur="4s" repeatCount="indefinite" />
  </rect>
  <rect x="16" y="16" width="1168" height="348" rx="16" fill="none" stroke="#00d4ff" stroke-width="0.5" opacity="0.08">
    <animate attributeName="opacity" values="0.05;0.15;0.05" dur="3s" repeatCount="indefinite" />
  </rect>

  <!-- Pulse Wave Line Animation -->
  <g>
    <path d="M0 200 Q100 170 200 200 T400 200 T600 200 T800 200 T1000 200 T1200 200" fill="none" stroke="url(#pulseLineGrad)" stroke-width="2" opacity="0.25">
      <animate attributeName="d" values="M0 200 Q100 170 200 200 T400 200 T600 200 T800 200 T1000 200 T1200 200;M0 200 Q100 230 200 200 T400 200 T600 200 T800 200 T1000 200 T1200 200;M0 200 Q100 170 200 200 T400 200 T600 200 T800 200 T1000 200 T1200 200" dur="4s" repeatCount="indefinite" />
    </path>
    <path d="M0 200 Q150 185 300 200 T600 200 T900 200 T1200 200" fill="none" stroke="#7c3aed" stroke-width="1.5" opacity="0.15">
      <animate attributeName="d" values="M0 200 Q150 185 300 200 T600 200 T900 200 T1200 200;M0 200 Q150 215 300 200 T600 200 T900 200 T1200 200;M0 200 Q150 185 300 200 T600 200 T900 200 T1200 200" dur="5s" repeatCount="indefinite" />
    </path>
    <path d="M0 200 Q200 215 400 200 T800 200 T1200 200" fill="none" stroke="#ec4899" stroke-width="1" opacity="0.1">
      <animate attributeName="d" values="M0 200 Q200 215 400 200 T800 200 T1200 200;M0 200 Q200 185 400 200 T800 200 T1200 200;M0 200 Q200 215 400 200 T800 200 T1200 200" dur="6s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Floating Particles -->
  <g>
    <circle cx="120" cy="90" r="3" fill="url(#particleGrad)" filter="url(#softGlow)">
      <animate attributeName="cy" values="90;60;90" dur="5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.3;1;0.3" dur="5s" repeatCount="indefinite" />
    </circle>
    <circle cx="1080" cy="280" r="3" fill="url(#particleGrad)" filter="url(#softGlow)">
      <animate attributeName="cy" values="280;250;280" dur="4.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="4.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="600" cy="330" r="3.5" fill="url(#particleGrad)" filter="url(#softGlow)">
      <animate attributeName="cy" values="330;300;330" dur="6s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.2;1;0.2" dur="6s" repeatCount="indefinite" />
    </circle>
    <circle cx="250" cy="280" r="2" fill="#00d4ff" opacity="0.4">
      <animate attributeName="cy" values="280;260;280" dur="3.8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.15;0.7;0.15" dur="3.8s" repeatCount="indefinite" />
    </circle>
    <circle cx="950" cy="80" r="2" fill="#7c3aed" opacity="0.4">
      <animate attributeName="cy" values="80;55;80" dur="4.2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.15;0.7;0.15" dur="4.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="80" cy="230" r="1.5" fill="#00d4ff" opacity="0.3">
      <animate attributeName="cy" values="230;215;230" dur="3.2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.1;0.5;0.1" dur="3.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="1120" cy="160" r="1.5" fill="#7c3aed" opacity="0.3">
      <animate attributeName="cy" values="160;145;160" dur="4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.1;0.5;0.1" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="340" cy="200" r="1.5" fill="#0090ff" opacity="0.3">
      <animate attributeName="cy" values="200;185;200" dur="3.6s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.1;0.5;0.1" dur="3.6s" repeatCount="indefinite" />
    </circle>
    <circle cx="860" cy="130" r="1.5" fill="#4f46e5" opacity="0.3">
      <animate attributeName="cy" values="130;115;130" dur="4.4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.1;0.5;0.1" dur="4.4s" repeatCount="indefinite" />
    </circle>
    <circle cx="180" cy="160" r="1" fill="#00d4ff" opacity="0.2">
      <animate attributeName="opacity" values="0;0.6;0" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle cx="1020" cy="90" r="1" fill="#7c3aed" opacity="0.2">
      <animate attributeName="opacity" values="0;0.6;0" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="500" cy="45" r="1" fill="#f59e0b" opacity="0.2">
      <animate attributeName="opacity" values="0;0.6;0" dur="2.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="700" cy="350" r="1" fill="#ec4899" opacity="0.2">
      <animate attributeName="opacity" values="0;0.6;0" dur="1.9s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Central Orb -->
  <circle cx="600" cy="110" r="80" fill="url(#primaryGrad)" opacity="0.03" filter="url(#strongGlow)">
    <animate attributeName="r" values="70;90;70" dur="6s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.02;0.05;0.02" dur="6s" repeatCount="indefinite" />
  </circle>

  <!-- Main Hero Content - Centered -->
  <g transform="translate(600, 185)" filter="url(#innerGlow)">
    <!-- Main Tagline -->
    <text x="0" y="-45" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="58" font-weight="700" fill="url(#textGrad)" text-anchor="middle" letter-spacing="-1">
      <tspan fill="url(#highlightGrad)">BUILD</tspan>
      <tspan fill="url(#textGrad)"> THE </tspan>
      <tspan fill="url(#highlightGrad)">FUTURE</tspan>
    </text>
    
    <!-- Subtitle -->
    <text x="0" y="5" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="16" font-weight="300" fill="#94a3b8" text-anchor="middle" letter-spacing="5" opacity="0.7">
      FULL-STACK DEVELOPMENT &amp; INNOVATION
    </text>

    <!-- Decorative Divider -->
    <line x1="-200" y1="25" x2="200" y2="25" stroke="url(#primaryGrad)" stroke-width="0.5" opacity="0.2">
      <animate attributeName="opacity" values="0.1;0.35;0.1" dur="3s" repeatCount="indefinite" />
    </line>
    <line x1="-130" y1="29" x2="130" y2="29" stroke="url(#secondaryGrad)" stroke-width="0.5" opacity="0.1">
      <animate attributeName="opacity" values="0.05;0.2;0.05" dur="3.5s" repeatCount="indefinite" />
    </line>

    <!-- Tech Stack Pills -->
    <g transform="translate(0, 55)">
      <g font-family="'SF Mono', 'Courier New', monospace" font-size="7.5" text-anchor="middle">
        <!-- Row 1 -->
        <rect x="-240" y="-12" width="52" height="18" rx="9" fill="none" stroke="#FFCA28" stroke-width="0.5" opacity="0.2" />
        <text x="-214" y="1" fill="#FFCA28" opacity="0.5" letter-spacing="0.5">Firebase</text>
        
        <rect x="-184" y="-12" width="50" height="18" rx="9" fill="none" stroke="#3776AB" stroke-width="0.5" opacity="0.2" />
        <text x="-159" y="1" fill="#3776AB" opacity="0.5" letter-spacing="0.5">Python</text>
        
        <rect x="-130" y="-12" width="50" height="18" rx="9" fill="none" stroke="#00599C" stroke-width="0.5" opacity="0.2" />
        <text x="-105" y="1" fill="#00599C" opacity="0.5" letter-spacing="0.5">C Lang</text>
        
        <rect x="-76" y="-12" width="46" height="18" rx="9" fill="none" stroke="#007396" stroke-width="0.5" opacity="0.2" />
        <text x="-53" y="1" fill="#007396" opacity="0.5" letter-spacing="0.5">Java</text>

        <rect x="-26" y="-12" width="46" height="18" rx="9" fill="none" stroke="#E34F26" stroke-width="0.5" opacity="0.2" />
        <text x="-3" y="1" fill="#E34F26" opacity="0.5" letter-spacing="0.5">HTML</text>
        
        <rect x="24" y="-12" width="42" height="18" rx="9" fill="none" stroke="#1572B6" stroke-width="0.5" opacity="0.2" />
        <text x="45" y="1" fill="#1572B6" opacity="0.5" letter-spacing="0.5">CSS</text>
        
        <rect x="70" y="-12" width="64" height="18" rx="9" fill="none" stroke="#F7DF1E" stroke-width="0.5" opacity="0.2" />
        <text x="102" y="1" fill="#F7DF1E" opacity="0.5" letter-spacing="0.5">JavaScript</text>
      </g>
    </g>

    <!-- CTA Tagline - Slashes removed -->
    <text x="0" y="95" font-family="'SF Mono', 'Courier New', monospace" font-size="9" fill="#94a3b8" text-anchor="middle" letter-spacing="4" opacity="0.2">
      <animate attributeName="opacity" values="0.15;0.35;0.15" dur="3s" repeatCount="indefinite" />
      INNOVATE • DEPLOY • SCALE
    </text>
  </g>

  <!-- Bottom Bar -->
  <g transform="translate(0, 355)">
    <rect x="50" y="0" width="1100" height="18" rx="9" fill="#0a0a1e" opacity="0.3" />
    
    <g font-family="'SF Mono', 'Courier New', monospace" font-size="7" fill="#94a3b8" opacity="0.3">
      <text x="65" y="12">●</text>
      <text x="75" y="12" fill="#00d4ff" opacity="0.5">PRODUCTION</text>
      <text x="165" y="12" fill="#94a3b8" opacity="0.2">|</text>
      <text x="175" y="12" fill="#94a3b8" opacity="0.3">v3.2.1</text>
      <text x="235" y="12" fill="#94a3b8" opacity="0.2">|</text>
      <text x="245" y="12" fill="#7c3aed" opacity="0.3">branch: main</text>
    </g>

    <g font-family="'SF Mono', 'Courier New', monospace" font-size="7" fill="#94a3b8" opacity="0.2">
      <text x="540" y="12" text-anchor="middle">●</text>
      <text x="550" y="12" text-anchor="middle" fill="#00d4ff" opacity="0.3">CI/CD PIPELINE • PASSED</text>
    </g>

    <g font-family="'SF Mono', 'Courier New', monospace" font-size="7" fill="#94a3b8" opacity="0.3">
      <text x="950" y="12" text-anchor="end">coverage: 94%</text>
      <text x="1030" y="12" fill="#94a3b8" opacity="0.2">|</text>
      <text x="1040" y="12" text-anchor="end" fill="#00d4ff" opacity="0.4">●</text>
      <text x="1050" y="12" text-anchor="end" fill="#94a3b8" opacity="0.3">deployed</text>
    </g>
  </g>

  <!-- Corner Accents -->
  <rect x="25" y="25" width="25" height="2" rx="1" fill="#00d4ff" opacity="0.1">
    <animate attributeName="opacity" values="0.05;0.15;0.05" dur="4s" repeatCount="indefinite" />
  </rect>
  <rect x="25" y="25" width="2" height="25" rx="1" fill="#00d4ff" opacity="0.1">
    <animate attributeName="opacity" values="0.05;0.15;0.05" dur="4s" repeatCount="indefinite" />
  </rect>
  <rect x="1150" y="25" width="25" height="2" rx="1" fill="#ec4899" opacity="0.1">
    <animate attributeName="opacity" values="0.05;0.15;0.05" dur="4s" repeatCount="indefinite" />
  </rect>
  <rect x="1173" y="25" width="2" height="25" rx="1" fill="#ec4899" opacity="0.1">
    <animate attributeName="opacity" values="0.05;0.15;0.05" dur="4s" repeatCount="indefinite" />
  </rect>
  <rect x="25" y="330" width="25" height="2" rx="1" fill="#ec4899" opacity="0.1">
    <animate attributeName="opacity" values="0.05;0.15;0.05" dur="4s" repeatCount="indefinite" />
  </rect>
  <rect x="25" y="328" width="2" height="25" rx="1" fill="#ec4899" opacity="0.1">
    <animate attributeName="opacity" values="0.05;0.15;0.05" dur="4s" repeatCount="indefinite" />
  </rect>
  <rect x="1150" y="330" width="25" height="2" rx="1" fill="#00d4ff" opacity="0.1">
    <animate attributeName="opacity" values="0.05;0.15;0.05" dur="4s" repeatCount="indefinite" />
  </rect>
  <rect x="1173" y="328" width="2" height="25" rx="1" fill="#00d4ff" opacity="0.1">
    <animate attributeName="opacity" values="0.05;0.15;0.05" dur="4s" repeatCount="indefinite" />
  </rect>
</svg>