<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="850" viewBox="0 0 1000 850">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e1a"/>
      <stop offset="50%" style="stop-color:#0d1b2a"/>
      <stop offset="100%" style="stop-color:#1b2a4a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4a9eff"/>
      <stop offset="50%" style="stop-color:#6c5ce7"/>
      <stop offset="100%" style="stop-color:#fd79a8"/>
    </linearGradient>
    <linearGradient id="solidBlueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2196F3"/>
      <stop offset="50%" style="stop-color:#1976D2"/>
      <stop offset="100%" style="stop-color:#1565C0"/>
    </linearGradient>
    <linearGradient id="lightBlueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4fc3f7"/>
      <stop offset="40%" style="stop-color:#4a9eff"/>
      <stop offset="70%" style="stop-color:#64b5f6"/>
      <stop offset="100%" style="stop-color:#81d4fa"/>
    </linearGradient>
    <linearGradient id="codeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4a9eff;stop-opacity:0.08"/>
      <stop offset="100%" style="stop-color:#6c5ce7;stop-opacity:0.04"/>
    </linearGradient>
    <linearGradient id="grid1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6c5ce7;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#6c5ce7;stop-opacity:0.03"/>
    </linearGradient>
    <linearGradient id="grid2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a9eff;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#4a9eff;stop-opacity:0.03"/>
    </linearGradient>
    <linearGradient id="grid3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fd79a8;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#fd79a8;stop-opacity:0.03"/>
    </linearGradient>
    <linearGradient id="grid4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fdcb6e;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#fdcb6e;stop-opacity:0.03"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect x="0" y="0" width="1000" height="850" rx="24" ry="24" fill="url(#bgGrad)"/>

  <!-- Glow border -->
  <rect x="0" y="0" width="1000" height="850" rx="24" ry="24" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" opacity="0.3"/>

  <!-- Inner border -->
  <rect x="2" y="2" width="996" height="846" rx="22" ry="22" fill="none" stroke="#4a9eff" stroke-width="0.5" opacity="0.08"/>

  <!-- ============ LEFT SECTION - Coding Animation Area ============ -->
  <rect x="0" y="0" width="370" height="850" rx="24" ry="24" fill="url(#codeGrad)"/>

  <!-- Terminal Window Background -->
  <rect x="25" y="25" width="320" height="800" rx="10" ry="10" fill="#0a0e1a" stroke="#4a9eff" stroke-width="0.8" opacity="0.9"/>

  <!-- Terminal Window Header -->
  <rect x="25" y="25" width="320" height="28" rx="10" ry="10" fill="#0d1b2a"/>
  <rect x="25" y="39" width="320" height="14" fill="#0d1b2a"/>
  
  <!-- Terminal dots -->
  <circle cx="43" cy="39" r="4.5" fill="#ff5f56"/>
  <circle cx="61" cy="39" r="4.5" fill="#ffbd2e"/>
  <circle cx="79" cy="39" r="4.5" fill="#27c93f"/>

  <!-- Terminal Text -->
  <g font-family="'Courier New', monospace" font-size="11">
    <text x="40" y="70" fill="#4a9eff">$</text>
    <text x="54" y="70" fill="#b0c4de">npm run dev</text>
    
    <text x="40" y="90" fill="#6c5ce7">➜</text>
    <text x="54" y="90" fill="#b0c4de">Starting development server...</text>
    
    <rect x="40" y="102" width="0" height="4" rx="2" fill="url(#accentGrad)">
      <animate attributeName="width" values="0;260" dur="3s" repeatCount="indefinite"/>
    </rect>
    
    <text x="40" y="130" fill="#27c93f">✓</text>
    <text x="54" y="130" fill="#b0c4de">Server ready on port 3000</text>
    
    <text x="40" y="157" fill="#4a9eff">$</text>
    <text x="54" y="157" fill="#b0c4de">git add .</text>
    
    <text x="40" y="177" fill="#27c93f">✓</text>
    <text x="54" y="177" fill="#b0c4de">Changes staged successfully</text>
    
    <text x="40" y="204" fill="#4a9eff">$</text>
    <text x="54" y="204" fill="#b0c4de">git commit -m "update"</text>
    
    <text x="40" y="224" fill="#27c93f">✓</text>
    <text x="54" y="224" fill="#b0c4de">Committed successfully</text>
    
    <text x="40" y="251" fill="#4a9eff">$</text>
    <text x="54" y="251" fill="#b0c4de">git push origin main</text>
    
    <text x="40" y="271" fill="#27c93f">✓</text>
    <text x="54" y="271" fill="#b0c4de">Deployed successfully</text>

    <text x="40" y="298" fill="#4a9eff">$</text>
    <text x="54" y="298" fill="#b0c4de">npm test</text>
    
    <text x="40" y="318" fill="#27c93f">✓</text>
    <text x="54" y="318" fill="#b0c4de">All tests passed (42)</text>
    
    <text x="40" y="345" fill="#4a9eff">$</text>
    <text x="54" y="345" fill="#b0c4de">docker build -t app .</text>
    
    <text x="40" y="365" fill="#27c93f">✓</text>
    <text x="54" y="365" fill="#b0c4de">Image built successfully</text>
    
    <text x="40" y="392" fill="#4a9eff">$</text>
    <text x="54" y="392" fill="#b0c4de">kubectl apply -f deploy.yaml</text>
    
    <text x="40" y="412" fill="#27c93f">✓</text>
    <text x="54" y="412" fill="#b0c4de">Deployment complete</text>
    
    <text x="40" y="439" fill="#4a9eff">$</text>
    <text x="54" y="439" fill="#b0c4de">curl https://myapp.com</text>
    
    <text x="40" y="459" fill="#27c93f">✓</text>
    <text x="54" y="459" fill="#b0c4de">Application is live!</text>

    <text x="40" y="486" fill="#4a9eff">$</text>
    <text x="54" y="486" fill="#b0c4de">npm run build</text>
    
    <text x="40" y="506" fill="#27c93f">✓</text>
    <text x="54" y="506" fill="#b0c4de">Build complete (optimized)</text>
    
    <text x="40" y="533" fill="#4a9eff">$</text>
    <text x="54" y="533" fill="#b0c4de">aws s3 sync ./build s3://myapp</text>
    
    <text x="40" y="553" fill="#27c93f">✓</text>
    <text x="54" y="553" fill="#b0c4de">Uploaded to S3 successfully</text>
    
    <text x="40" y="580" fill="#4a9eff">$</text>
    <text x="54" y="580" fill="#b0c4de">cloudfront create-invalidation</text>
    
    <text x="40" y="600" fill="#27c93f">✓</text>
    <text x="54" y="600" fill="#b0c4de">CDN cache invalidated</text>
    
    <text x="40" y="627" fill="#4a9eff">$</text>
    <text x="54" y="627" fill="#b0c4de">echo "Deployment complete!"</text>
    
    <text x="40" y="647" fill="#27c93f">✓</text>
    <text x="54" y="647" fill="#b0c4de">Deployment complete!</text>
    
    <text x="40" y="674" fill="#4a9eff">$</text>
    <text x="54" y="674" fill="#b0c4de">git checkout -b feature/new</text>
    
    <text x="40" y="694" fill="#27c93f">✓</text>
    <text x="54" y="694" fill="#b0c4de">Branch created successfully</text>
    
    <text x="40" y="721" fill="#4a9eff">$</text>
    <text x="54" y="721" fill="#b0c4de">code .</text>
    
    <text x="40" y="741" fill="#27c93f">✓</text>
    <text x="54" y="741" fill="#b0c4de">VS Code opened</text>
    
    <text x="40" y="768" fill="#4a9eff">$</text>
    <text x="54" y="768" fill="#b0c4de">npm start</text>
    
    <!-- Blinking cursor -->
    <text x="40" y="795" fill="#4a9eff">$</text>
    <text x="54" y="795" fill="#b0c4de">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
      █
    </text>
  </g>

  <!-- Vertical divider -->
  <line x1="370" y1="25" x2="370" y2="825" stroke="url(#accentGrad)" stroke-width="1" opacity="0.1"/>

  <!-- ============ RIGHT SECTION ============ -->
  <g transform="translate(400, 25)">
    
    <!-- ============ CREATIVE ABOUT ME HEADING - SOLID BLUE ============ -->
    <g transform="translate(0, 20)">
      
      <!-- Decorative bracket -->
      <text x="0" y="28" font-family="'Courier New', monospace" font-size="32" fill="url(#solidBlueGrad)" opacity="0.4">[</text>
      
      <!-- Main heading with solid blue gradient -->
      <text x="22" y="28" font-family="'Segoe UI', Arial, sans-serif" font-size="28" font-weight="bold" fill="url(#solidBlueGrad)" filter="url(#glow)">
        About Me
      </text>
      
      <!-- Closing bracket -->
      <text x="158" y="28" font-family="'Courier New', monospace" font-size="32" fill="url(#solidBlueGrad)" opacity="0.4">]</text>
      
      <!-- Small decorative underline with dots -->
      <rect x="22" y="38" width="130" height="2" rx="1" fill="url(#solidBlueGrad)" opacity="0.15"/>
      <circle cx="22" cy="39" r="2" fill="#2196F3" opacity="0.3"/>
      <circle cx="150" cy="39" r="2" fill="#1565C0" opacity="0.3"/>
      
    </g>

    <!-- Bio paragraphs -->
    <g font-family="'Segoe UI', Arial, sans-serif" font-size="13.5" fill="#b0c4de">
      
      <!-- Paragraph 1 -->
      <text x="0" y="105">
        <tspan x="0" dy="0">I'm Atharva Thakur, a developer passionate about building modern,</tspan>
        <tspan x="0" dy="24">practical, and user-focused digital experiences.</tspan>
      </text>

      <!-- Paragraph 2 -->
      <text x="0" y="175">
        <tspan x="0" dy="0">I work across web development, application development, UI/UX</tspan>
        <tspan x="0" dy="24">design, and cloud technologies, with a focus on turning ideas</tspan>
        <tspan x="0" dy="24">into polished and functional products.</tspan>
      </text>

      <!-- Paragraph 3 -->
      <text x="0" y="275">
        <tspan x="0" dy="0">I work with technologies including JavaScript, Python, React,</tspan>
        <tspan x="0" dy="24">Firebase, and modern web development tools, with an emphasis</tspan>
        <tspan x="0" dy="24">on clean architecture, responsive interfaces, maintainable</tspan>
        <tspan x="0" dy="24">code, and thoughtful user experiences.</tspan>
      </text>
    </g>

    <!-- Divider -->
    <rect x="0" y="380" width="570" height="3" rx="1.5" fill="url(#solidBlueGrad)" opacity="0.1"/>

    <!-- ============ 2x2 GRID SECTION ============ -->
    <g transform="translate(0, 400)">
      
      <!-- Grid Box 1 - My Approach -->
      <rect x="0" y="0" width="275" height="95" rx="10" ry="10" fill="url(#grid1)" stroke="#6c5ce7" stroke-width="0.8" opacity="0.6"/>
      
      <text x="14" y="22" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="bold" fill="#6c5ce7">✦ My approach:</text>
      
      <text x="14" y="48" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#b0c4de">
        <tspan x="14" dy="0">I believe in building with purpose,</tspan>
        <tspan x="14" dy="18">learning by doing, and continuously</tspan>
        <tspan x="14" dy="18">improving through every project.</tspan>
      </text>

      <!-- Grid Box 2 - Currently -->
      <rect x="295" y="0" width="275" height="95" rx="10" ry="10" fill="url(#grid2)" stroke="#4a9eff" stroke-width="0.8" opacity="0.6"/>
      
      <text x="309" y="22" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="bold" fill="#4a9eff">⟳ Currently:</text>
      
      <text x="309" y="48" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#b0c4de">
        <tspan x="309" dy="0">I'm exploring modern web technologies,</tspan>
        <tspan x="309" dy="18">scalable applications, automation, and</tspan>
        <tspan x="309" dy="18">innovative solutions to real-world problems.</tspan>
      </text>

      <!-- Grid Box 3 - Beyond coding -->
      <rect x="0" y="110" width="275" height="95" rx="10" ry="10" fill="url(#grid3)" stroke="#fd79a8" stroke-width="0.8" opacity="0.6"/>
      
      <text x="14" y="132" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="bold" fill="#fd79a8">✦ Beyond coding:</text>
      
      <text x="14" y="158" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#b0c4de">
        <tspan x="14" dy="0">I enjoy experimenting with new ideas,</tspan>
        <tspan x="14" dy="18">exploring emerging technologies, and</tspan>
        <tspan x="14" dy="18">transforming concepts into projects.</tspan>
      </text>

      <!-- Grid Box 4 - Long-term goal -->
      <rect x="295" y="110" width="275" height="95" rx="10" ry="10" fill="url(#grid4)" stroke="#fdcb6e" stroke-width="0.8" opacity="0.6"/>
      
      <text x="309" y="132" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="bold" fill="#fdcb6e">★ Long-term goal:</text>
      
      <text x="309" y="158" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#b0c4de">
        <tspan x="309" dy="0">To become a versatile developer</tspan>
        <tspan x="309" dy="18">capable of designing, building, and</tspan>
        <tspan x="309" dy="18">scaling products with strong engineering.</tspan>
      </text>
    </g>

    <!-- ============ THE FUTURE I ENVISION SECTION ============ -->
    
    <!-- Top spacing -->
    <rect x="0" y="605" width="570" height="1.5" fill="url(#solidBlueGrad)" opacity="0.08" rx="0.75"/>
    
    <!-- Creative Heading -->
    <g transform="translate(0, 625)">
      <!-- Decorative line left -->
      <rect x="0" y="12" width="40" height="2" rx="1" fill="url(#solidBlueGrad)" opacity="0.6"/>
      
      <!-- Heading text with solid blue gradient -->
      <text x="50" y="18" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="bold" fill="url(#solidBlueGrad)">
        The Future I Envision
      </text>
      
      <!-- Decorative line right -->
      <rect x="225" y="12" width="345" height="2" rx="1" fill="url(#solidBlueGrad)" opacity="0.3"/>
      
      <!-- Small decorative dot -->
      <circle cx="222" cy="12" r="2.5" fill="#2196F3" opacity="0.5"/>
    </g>

    <!-- Extra line space after heading -->
    <g font-family="'Segoe UI', Arial, sans-serif" font-size="13.5" fill="#b0c4de">
      <text x="0" y="675">
        <tspan x="0" dy="0">I aim to grow as a well-rounded technology professional by continuously</tspan>
        <tspan x="0" dy="24">strengthening my technical expertise, problem-solving abilities, and</tspan>
        <tspan x="0" dy="24">understanding of product development. I value consistency, attention</tspan>
        <tspan x="0" dy="24">to detail, and a practical approach to challenges, with the long-term</tspan>
        <tspan x="0" dy="24">goal of contributing to innovative projects and building technology</tspan>
        <tspan x="0" dy="24">that delivers measurable value.</tspan>
      </text>
    </g>
  </g>
</svg>