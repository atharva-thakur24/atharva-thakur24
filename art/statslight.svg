<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280">
  <defs>
    <!-- Background Gradient - Pure White -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:1" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2563eb" />
      <stop offset="50%" style="stop-color:#7c3aed" />
      <stop offset="100%" style="stop-color:#db2777" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0891b2" />
      <stop offset="100%" style="stop-color:#2563eb" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="intenseGlow">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <line x1="80" y1="0" x2="80" y2="80" stroke="#2563eb" stroke-width="0.3" stroke-opacity="0.06" />
      <line x1="0" y1="80" x2="80" y2="80" stroke="#2563eb" stroke-width="0.3" stroke-opacity="0.06" />
    </pattern>

    <!-- Circuit Pattern -->
    <pattern id="circuit" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M0 60 L30 60 L40 70 L40 90 L60 90 L70 80 L70 60 L90 60" fill="none" stroke="#0891b2" stroke-width="0.5" stroke-opacity="0.08" />
      <path d="M80 0 L80 30 L70 40 L50 40 L40 30 L40 10 L20 10 L10 20 L10 40" fill="none" stroke="#7c3aed" stroke-width="0.5" stroke-opacity="0.08" />
      <circle cx="40" cy="60" r="2" fill="#0891b2" fill-opacity="0.08" />
      <circle cx="80" cy="40" r="2" fill="#7c3aed" fill-opacity="0.08" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="280" fill="url(#bgGrad)" rx="20" />
  <rect width="1200" height="280" fill="url(#grid)" rx="20" />
  <rect width="1200" height="280" fill="url(#circuit)" rx="20" />
  <rect x="3" y="3" width="1194" height="274" rx="18" fill="none" stroke="url(#primaryGrad)" stroke-width="1" stroke-opacity="0.15" />
  <rect x="8" y="8" width="1184" height="264" rx="14" fill="none" stroke="#2563eb" stroke-width="0.5" stroke-opacity="0.1" />

  <!-- Glow Orbs -->
  <circle cx="600" cy="140" r="100" fill="url(#primaryGrad)" fill-opacity="0.04" filter="url(#intenseGlow)" />
  <circle cx="600" cy="140" r="65" fill="url(#cyanGrad)" fill-opacity="0.05" filter="url(#glow)" />

  <!-- Title -->
  <g transform="translate(600, 35)">
    <text x="0" y="0" font-family="'Segoe UI', 'SF Pro Display', sans-serif" font-size="18" font-weight="700" fill="#2563eb" text-anchor="middle" letter-spacing="2">
      📊 GITHUB STREAK STATS
    </text>
    <rect x="-120" y="8" width="240" height="1.5" rx="0.75" fill="url(#primaryGrad)" fill-opacity="0.2" />
  </g>

  <!-- Streak Stats Image -->
  <image x="10" y="55" width="1180" height="195" href="https://streak-stats.demolab.com/?user=atharva-thakur24&amp;theme=ayu-light&amp;hide_border=true&amp;background=FFFFFF&amp;stroke=2563eb&amp;ring=2563eb&amp;fire=db2777&amp;currStreakLabel=2563eb&amp;sideLabels=475569&amp;currStreakNum=1e293b&amp;sideNums=1e293b&amp;dates=64748b&amp;card_width=1180" />

  <!-- Decorative Corner Accents -->
  <g opacity="0.6">
    <rect x="20" y="20" width="20" height="2" rx="1" fill="#2563eb" fill-opacity="0.2" />
    <rect x="20" y="20" width="2" height="20" rx="1" fill="#2563eb" fill-opacity="0.2" />
    <rect x="1160" y="20" width="20" height="2" rx="1" fill="#db2777" fill-opacity="0.2" />
    <rect x="1178" y="20" width="2" height="20" rx="1" fill="#db2777" fill-opacity="0.2" />
    <rect x="20" y="240" width="20" height="2" rx="1" fill="#db2777" fill-opacity="0.2" />
    <rect x="20" y="238" width="2" height="20" rx="1" fill="#db2777" fill-opacity="0.2" />
    <rect x="1160" y="240" width="20" height="2" rx="1" fill="#2563eb" fill-opacity="0.2" />
    <rect x="1178" y="238" width="2" height="20" rx="1" fill="#2563eb" fill-opacity="0.2" />
  </g>

  <!-- Bottom Status Bar -->
  <g transform="translate(0, 255)" opacity="0.8">
    <rect x="40" y="0" width="1120" height="20" rx="10" fill="#f8fafc" fill-opacity="0.7" stroke="#2563eb" stroke-width="0.5" stroke-opacity="0.12" />
    
    <g font-family="'SF Mono', 'Courier New', monospace" font-size="7.5" fill="#475569">
      <text x="60" y="13" fill="#0891b2" fill-opacity="0.7">●</text>
      <text x="72" y="13" fill="#475569" fill-opacity="0.6">STATUS: SYNCED</text>
      
      <text x="250" y="13" fill-opacity="0.3">|</text>
      <text x="265" y="13" fill-opacity="0.5">STREAK: ACTIVE</text>
      
      <text x="430" y="13" fill-opacity="0.3">|</text>
      <text x="445" y="13" fill="#7c3aed" fill-opacity="0.6">UPDATED: LIVE</text>

      <text x="850" y="13" text-anchor="end" fill-opacity="0.5">COMMITS: 42</text>
      
      <text x="980" y="13" fill-opacity="0.3">|</text>
      <text x="995" y="13" fill="#16a34a" fill-opacity="0.6">●</text>
      <text x="1005" y="13" fill-opacity="0.5">ACTIVE</text>
      
      <text x="1115" y="13" text-anchor="end" fill="#94a3b8" fill-opacity="0.4">v2.0</text>
    </g>
  </g>
</svg>
