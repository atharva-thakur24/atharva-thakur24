<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e1a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0d1b2a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1b2a4a;stop-opacity:1" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4a9eff" />
      <stop offset="50%" style="stop-color:#6c5ce7" />
      <stop offset="100%" style="stop-color:#fd79a8" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff" />
      <stop offset="100%" style="stop-color:#0090ff" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="intenseGlow">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <line x1="80" y1="0" x2="80" y2="80" stroke="#4a9eff" stroke-width="0.3" opacity="0.03" />
      <line x1="0" y1="80" x2="80" y2="80" stroke="#4a9eff" stroke-width="0.3" opacity="0.03" />
    </pattern>

    <!-- Circuit Pattern -->
    <pattern id="circuit" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M0 60 L30 60 L40 70 L40 90 L60 90 L70 80 L70 60 L90 60" fill="none" stroke="#00d4ff" stroke-width="0.5" opacity="0.04" />
      <path d="M80 0 L80 30 L70 40 L50 40 L40 30 L40 10 L20 10 L10 20 L10 40" fill="none" stroke="#7c3aed" stroke-width="0.5" opacity="0.04" />
      <circle cx="40" cy="60" r="2" fill="#00d4ff" opacity="0.04" />
      <circle cx="80" cy="40" r="2" fill="#7c3aed" opacity="0.04" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="250" fill="url(#bgGrad)" rx="20" />
  <rect width="1200" height="250" fill="url(#grid)" rx="20" />
  <rect width="1200" height="250" fill="url(#circuit)" rx="20" />
  <rect x="3" y="3" width="1194" height="244" rx="18" fill="none" stroke="url(#primaryGrad)" stroke-width="1" opacity="0.15" />
  <rect x="8" y="8" width="1184" height="234" rx="14" fill="none" stroke="#4a9eff" stroke-width="0.5" opacity="0.06" />

  <!-- Glow Orbs -->
  <circle cx="600" cy="125" r="100" fill="url(#primaryGrad)" opacity="0.04" filter="url(#intenseGlow)" />
  <circle cx="600" cy="125" r="65" fill="url(#cyanGrad)" opacity="0.05" filter="url(#glow)" />

  <!-- Title -->
  <g transform="translate(600, 30)">
    <text x="0" y="0" font-family="'Segoe UI', 'SF Pro Display', sans-serif" font-size="18" font-weight="700" fill="#00d4ff" text-anchor="middle" letter-spacing="2">
      GITHUB STREAKS
    </text>
    <rect x="-120" y="8" width="240" height="1.5" rx="0.75" fill="url(#primaryGrad)" opacity="0.2" />
  </g>

  <!-- Streak Stats Image - Embedded -->
  <g transform="translate(10, 45)">
    <foreignObject width="1180" height="195">
      <div xmlns="http://www.w3.org/1999/xhtml" style="width: 100%; height: 100%; display: flex; justify-content: center; align-items: center;">
        <img width="100%" src="https://streak-stats.demolab.com/?user=atharva-thakur24&amp;hide_border=true&amp;background=0A101F&amp;stroke=22D3EE&amp;ring=A78BFA&amp;fire=10B981&amp;currStreakLabel=22D3EE&amp;sideLabels=94A3B8&amp;currStreakNum=F8FAFC&amp;sideNums=F8FAFC&amp;dates=64748B&amp;titleColor=22D3EE&amp;card_width=1180" alt="Atharva's streak stats" />
      </div>
    </foreignObject>
  </g>

  <!-- Decorative Corner Accents -->
  <g opacity="0.6">
    <rect x="20" y="20" width="20" height="2" rx="1" fill="#00d4ff" opacity="0.2" />
    <rect x="20" y="20" width="2" height="20" rx="1" fill="#00d4ff" opacity="0.2" />
    <rect x="1160" y="20" width="20" height="2" rx="1" fill="#ec4899" opacity="0.2" />
    <rect x="1178" y="20" width="2" height="20" rx="1" fill="#ec4899" opacity="0.2" />
    <rect x="20" y="210" width="20" height="2" rx="1" fill="#ec4899" opacity="0.2" />
    <rect x="20" y="208" width="2" height="20" rx="1" fill="#ec4899" opacity="0.2" />
    <rect x="1160" y="210" width="20" height="2" rx="1" fill="#00d4ff" opacity="0.2" />
    <rect x="1178" y="208" width="2" height="20" rx="1" fill="#00d4ff" opacity="0.2" />
  </g>

  <!-- Bottom Status Bar -->
  <g transform="translate(0, 225)" opacity="0.8">
    <rect x="40" y="0" width="1120" height="20" rx="10" fill="#0a0e1a" opacity="0.3" stroke="#4a9eff" stroke-width="0.5" stroke-opacity="0.08" />
    
    <g font-family="'SF Mono', 'Courier New', monospace" font-size="7.5" fill="#4a6a7a">
      <text x="60" y="13" fill="#00d4ff" opacity="0.5">●</text>
      <text x="72" y="13" fill="#94a3b8" opacity="0.4">STATUS: SYNCED</text>
      
      <text x="250" y="13" opacity="0.2">|</text>
      <text x="265" y="13" opacity="0.3">STREAK: ACTIVE</text>
      
      <text x="430" y="13" opacity="0.2">|</text>
      <text x="445" y="13" fill="#7c3aed" opacity="0.4">UPDATED: LIVE</text>

      <text x="850" y="13" text-anchor="end" opacity="0.3">REGULAR</text>
      
      <text x="980" y="13" opacity="0.2">|</text>
      <text x="995" y="13" fill="#27c93f" opacity="0.4">●</text>
      <text x="1005" y="13" opacity="0.3">ACTIVE</text>
      
      <text x="1115" y="13" text-anchor="end" fill="#4a6a7a" opacity="0.2">v2.0</text>
    </g>
  </g>
</svg>
