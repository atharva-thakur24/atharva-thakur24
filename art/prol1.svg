<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380">
  <defs>
    <!-- Simple Light Background -->
    <linearGradient id="bgMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f4f8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#e2e8f0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0f4f8;stop-opacity:1" />
    </linearGradient>

    <!-- Primary Accent - Blue -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0090ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0066cc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0090ff;stop-opacity:1" />
    </linearGradient>

    <!-- Secondary Accent - Purple -->
    <linearGradient id="secondaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6d28d9;stop-opacity:1" />
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a202c;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2d3748;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a202c;stop-opacity:1" />
    </linearGradient>

    <!-- Highlight Text Gradient -->
    <linearGradient id="highlightGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0090ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>

    <!-- Simple Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <line x1="40" y1="0" x2="40" y2="40" stroke="#0090ff" stroke-width="0.2" opacity="0.04" />
      <line x1="0" y1="40" x2="40" y2="40" stroke="#0090ff" stroke-width="0.2" opacity="0.04" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="380" fill="url(#bgMain)" rx="16" />
  <rect width="1200" height="380" fill="url(#gridPattern)" rx="16" />

  <!-- Border - Simplified -->
  <rect x="12" y="12" width="1176" height="356" rx="20" fill="none" stroke="#0090ff" stroke-width="1" opacity="0.12" />
  <rect x="16" y="16" width="1168" height="348" rx="16" fill="none" stroke="#0090ff" stroke-width="0.5" opacity="0.06" />

  <!-- Single Pulse Wave - Optimized -->
  <path d="M0 200 Q150 185 300 200 T600 200 T900 200 T1200 200" fill="none" stroke="#0090ff" stroke-width="1.5" opacity="0.15">
    <animate attributeName="d" values="M0 200 Q150 185 300 200 T600 200 T900 200 T1200 200;M0 200 Q150 215 300 200 T600 200 T900 200 T1200 200;M0 200 Q150 185 300 200 T600 200 T900 200 T1200 200" dur="5s" repeatCount="indefinite" />
  </path>

  <!-- Reduced Particles - Only 6 -->
  <g>
    <circle cx="120" cy="90" r="2.5" fill="#0090ff" opacity="0.3">
      <animate attributeName="cy" values="90;65;90" dur="4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.15;0.5;0.15" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="1080" cy="280" r="2.5" fill="#7c3aed" opacity="0.3">
      <animate attributeName="cy" values="280;255;280" dur="4.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.15;0.5;0.15" dur="4.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="300" cy="300" r="2" fill="#0090ff" opacity="0.25">
      <animate attributeName="cy" values="300;280;300" dur="3.8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.1;0.4;0.1" dur="3.8s" repeatCount="indefinite" />
    </circle>
    <circle cx="900" cy="80" r="2" fill="#7c3aed" opacity="0.25">
      <animate attributeName="cy" values="80;60;80" dur="4.2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.1;0.4;0.1" dur="4.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="500" cy="50" r="1.5" fill="#ec4899" opacity="0.2">
      <animate attributeName="cy" values="50;35;50" dur="3.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.08;0.35;0.08" dur="3.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="700" cy="340" r="1.5" fill="#0090ff" opacity="0.2">
      <animate attributeName="cy" values="340;325;340" dur="3.2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.08;0.35;0.08" dur="3.2s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Main Hero Content -->
  <g transform="translate(600, 185)">
    <!-- Main Tagline -->
    <text x="0" y="-45" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="56" font-weight="700" fill="url(#textGrad)" text-anchor="middle" letter-spacing="-1">
      <tspan fill="url(#highlightGrad)">BUILD</tspan>
      <tspan fill="url(#textGrad)"> THE </tspan>
      <tspan fill="url(#highlightGrad)">FUTURE</tspan>
    </text>
    
    <!-- Subtitle -->
    <text x="0" y="5" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="15" font-weight="300" fill="#4a5568" text-anchor="middle" letter-spacing="4" opacity="0.7">
      FULL-STACK DEVELOPMENT &amp; INNOVATION
    </text>

    <!-- Decorative Divider -->
    <line x1="-180" y1="25" x2="180" y2="25" stroke="url(#primaryGrad)" stroke-width="0.5" opacity="0.15" />
    <line x1="-110" y1="29" x2="110" y2="29" stroke="url(#secondaryGrad)" stroke-width="0.5" opacity="0.08" />

    <!-- Tech Stack Pills -->
    <g transform="translate(0, 52)">
      <g font-family="'SF Mono', 'Courier New', monospace" font-size="7" text-anchor="middle">
        <rect x="-240" y="-12" width="52" height="18" rx="9" fill="#f8fafc" stroke="#FFCA28" stroke-width="0.5" opacity="0.4" />
        <text x="-214" y="1" fill="#b8860b" opacity="0.7" letter-spacing="0.5">Firebase</text>
        
        <rect x="-184" y="-12" width="50" height="18" rx="9" fill="#f8fafc" stroke="#3776AB" stroke-width="0.5" opacity="0.4" />
        <text x="-159" y="1" fill="#2a5f8a" opacity="0.7" letter-spacing="0.5">Python</text>
        
        <rect x="-130" y="-12" width="50" height="18" rx="9" fill="#f8fafc" stroke="#00599C" stroke-width="0.5" opacity="0.4" />
        <text x="-105" y="1" fill="#004a7c" opacity="0.7" letter-spacing="0.5">C Lang</text>
        
        <rect x="-76" y="-12" width="46" height="18" rx="9" fill="#f8fafc" stroke="#007396" stroke-width="0.5" opacity="0.4" />
        <text x="-53" y="1" fill="#005c78" opacity="0.7" letter-spacing="0.5">Java</text>

        <rect x="-26" y="-12" width="46" height="18" rx="9" fill="#f8fafc" stroke="#E34F26" stroke-width="0.5" opacity="0.4" />
        <text x="-3" y="1" fill="#b63e1e" opacity="0.7" letter-spacing="0.5">HTML</text>
        
        <rect x="24" y="-12" width="42" height="18" rx="9" fill="#f8fafc" stroke="#1572B6" stroke-width="0.5" opacity="0.4" />
        <text x="45" y="1" fill="#115a91" opacity="0.7" letter-spacing="0.5">CSS</text>
        
        <rect x="70" y="-12" width="64" height="18" rx="9" fill="#f8fafc" stroke="#F7DF1E" stroke-width="0.5" opacity="0.4" />
        <text x="102" y="1" fill="#c9b318" opacity="0.7" letter-spacing="0.5">JavaScript</text>
      </g>
    </g>

    <!-- Bottom Tagline -->
    <text x="0" y="90" font-family="'SF Mono', 'Courier New', monospace" font-size="8" fill="#4a5568" text-anchor="middle" letter-spacing="3" opacity="0.2">
      INNOVATE • DEPLOY • SCALE
    </text>
  </g>

  <!-- Bottom Bar -->
  <g transform="translate(0, 355)">
    <rect x="50" y="0" width="1100" height="18" rx="9" fill="#e8edf3" opacity="0.5" />
    
    <g font-family="'SF Mono', 'Courier New', monospace" font-size="6.5" fill="#4a5568" opacity="0.5">
      <text x="65" y="12">●</text>
      <text x="75" y="12" fill="#0090ff" opacity="0.6">PRODUCTION</text>
      <text x="165" y="12" fill="#4a5568" opacity="0.3">|</text>
      <text x="175" y="12" fill="#4a5568" opacity="0.5">v3.2.1</text>
      <text x="235" y="12" fill="#4a5568" opacity="0.3">|</text>
      <text x="245" y="12" fill="#7c3aed" opacity="0.5">branch: main</text>
    </g>

    <g font-family="'SF Mono', 'Courier New', monospace" font-size="6.5" fill="#4a5568" opacity="0.4">
      <text x="540" y="12" text-anchor="middle">●</text>
      <text x="550" y="12" text-anchor="middle" fill="#0090ff" opacity="0.5">CI/CD PIPELINE • PASSED</text>
    </g>

    <g font-family="'SF Mono', 'Courier New', monospace" font-size="6.5" fill="#4a5568" opacity="0.5">
      <text x="950" y="12" text-anchor="end">coverage: 94%</text>
      <text x="1030" y="12" fill="#4a5568" opacity="0.3">|</text>
      <text x="1040" y="12" text-anchor="end" fill="#0090ff" opacity="0.5">●</text>
      <text x="1050" y="12" text-anchor="end" fill="#4a5568" opacity="0.5">deployed</text>
    </g>
  </g>

  <!-- Corner Accents -->
  <rect x="25" y="25" width="20" height="2" rx="1" fill="#0090ff" opacity="0.12" />
  <rect x="25" y="25" width="2" height="20" rx="1" fill="#0090ff" opacity="0.12" />
  <rect x="1155" y="25" width="20" height="2" rx="1" fill="#ec4899" opacity="0.12" />
  <rect x="1173" y="25" width="2" height="20" rx="1" fill="#ec4899" opacity="0.12" />
  <rect x="25" y="335" width="20" height="2" rx="1" fill="#ec4899" opacity="0.12" />
  <rect x="25" y="333" width="2" height="20" rx="1" fill="#ec4899" opacity="0.12" />
  <rect x="1155" y="335" width="20" height="2" rx="1" fill="#0090ff" opacity="0.12" />
  <rect x="1173" y="333" width="2" height="20" rx="1" fill="#0090ff" opacity="0.12" />
</svg>
